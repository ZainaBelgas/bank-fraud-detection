<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultat de la Prédiction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center p-5">
    <div class="container">
        <h1 class="mb-4">Résultat de la prédiction</h1>
        
        {% if "Fraude" in prediction %}
            <div class="alert alert-danger fs-4">
                🚨 {{ prediction }}
            </div>
        {% else %}
            <div class="alert alert-success fs-4">
                ✅ {{ prediction }}
            </div>
        {% endif %}  
        

        <a href="{{ url_for('index') }}" class="btn btn-primary mt-4">← Retour à l'accueil</a>
    </div>
</body>
</html>
