<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détection de Fraude</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<<body class="bg-light">
    <div class="container mt-5">
      <h1 class="mb-4">🔍 Détection de Fraude Bancaire</h1>
      
      <form method="POST" class="border p-4 bg-white rounded shadow-sm">
        <div class="mb-3">
          <label>Amount:</label>
          <input type="number" name="Amount" class="form-control" step="any" required>
        </div>
        <div class="mb-3">
          <label>V1:</label>
          <input type="number" name="V1" class="form-control" step="any" required>
        </div>
        <div class="mb-3">
          <label>V2:</label>
          <input type="number" name="V2" class="form-control" step="any" required>
        </div>
        <div class="mb-3">
          <label>V3:</label>
          <input type="number" name="V3" class="form-control" step="any" required>
        </div>
        <div class="mb-3">
          <label>V4:</label>
          <input type="number" name="V4" class="form-control" step="any" required>
        </div>
        <div class="mb-3">
          <label>V5:</label>
          <input type="number" name="V5" class="form-control" step="any" required>
        </div>
        <button type="submit" class="btn btn-primary">Prédire</button>
      </form>
  
      {% if result %}
        <div class="alert alert-info mt-4">
          <strong>Résultat :</strong> {{ result.html }}
        </div>
      {% endif %}
  
      <a href="{{ url_for('stats') }}" class="btn btn-secondary mt-3">📊 Voir les Statistiques</a>
    </div>
  

</body>
</html>
