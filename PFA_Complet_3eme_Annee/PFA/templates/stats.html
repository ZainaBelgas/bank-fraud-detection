<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statistiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="bg-light">
    <div class="container mt-5">
      <h1>📊 Statistiques de Détection</h1>
      <p>Nombre total de transactions : <strong>{{ total }}</strong></p>
      <p>Fraudes détectées : <strong>{{ total_fraude }}</strong></p>
      <p>Taux de fraude : <strong>{{ taux_fraude }}%</strong></p>
  
      <canvas id="fraudChart" width="400" height="200" class="my-4"></canvas>
  
      <script>
        const ctx = document.getElementById('fraudChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Normale', 'Fraude'],
            datasets: [{
              label: 'Nombre de Prédictions',
              data: [{{ total - total_fraude }}, {{ total_fraude }}],
              backgroundColor: ['#4CAF50', '#F44336'],
            }]
          },
          options: {
            responsive: true
          }
        });
      </script>
  
      <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">🏠 Retour</a>
    </div>
 
  
    
</body>
</html>
